<body style="background: rgb(255,255,255);">
    <h3 class="text-center">Information</h3>
    <p class="text-center" style="font-size: 20px;">Veuillez remplir la formulaire pour faciliter de votre réponse que cela soit validé ou non validé votre demande de réserver le Dj que vous souhaitez réserver</p>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <div class="container" style="padding-left: 0px;">
                    <div class="screen"><input class="form-control-lg name" type="text" style="border-top-style: none;border-right-style: none;border-left-style: none;margin: 10px;transform: perspective(0px);font-size: 16px;width: 500.8px;margin-left: 0px;" placeholder="Nom"></div>
                    <div class="telephone"><input class="form-control-lg" type="tel" style="border-top-style: none;border-right-style: none;border-left-style: none;margin: 10px;font-size: 18px;width: 501px;margin-left: 0px;" placeholder="Numero de telephone"></div>
                    <div style="margin: 10px;">
                        <h6 class="text-uppercase" style="padding-top: 0px;opacity: 0.60;">Description*</h6><textarea style="height: 251.6px;width: 492.6px;margin: 0px;border-style: solid;" placeholder="Décrivez votre événement"></textarea>
                    </div>
                </div>
            </div>
            <div class="col-md-6"><img class="img-fluid" src="assets/img/FB_IMG_17053463299719034.jpg"></div>
        </div>
    </div>
    <section class="event" style="padding-top: 20px;background: rgba(238,227,227,0.36);margin-top: 20px;">
        <h1 class="text-center">Votre événement</h1>
        <div class="container2">
            <div style="margin: 10px;">
                <h6 style="opacity: 0.60;">Genre d'événement *</h6><input class="form-control-lg genre" type="text" placeholder="Occasion(Mariage, Anniversaire...)" style="margin: 0px;width: 530.6px;">
            </div>
            <div class="date" style="margin: 11px;">
                <h6 style="opacity: 0.60;">Date d'événement *</h6><input class="form-control-lg" type="date" style="margin: 0px;width: 521.8px;">
            </div>
            <div style="margin: 10px;">
                <h6 style="opacity: 0.60;">Votre événement commence à *</h6><input class="form-control-lg" type="time" style="margin: 0px;width: 245.4px;padding-left: 80px;font-size: 26px;">
            </div>
            <div class="heure"><input class="form-control-lg" type="number" placeholder="Durée d'événement" style="margin: 10px;width: 245.6px;"></div>
            <div class="ville"><input class="form-control-lg input_ville" type="text" style="margin: 10px;" placeholder="Ville"><input class="form-control-lg input_ville" type="text" style="margin: 10px;" placeholder="Adresse"></div>
        </div><button class="btn btn-primary form-btn" type="submit">SAVE </button><button class="btn btn-danger form-btn" type="reset">CANCEL </button>
    </section>
